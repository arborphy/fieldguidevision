[project]
name = "descriptive-vocab-assets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
verify = [
    "pillow>=10.4.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "pytest>=8.0.0",
]
segmentation = [
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=5.0.0",
]
train = [
    "ultralytics==8.4.190",
    "torch>=2.5.1",
    "numpy>=1.26",
    "pillow>=10.4.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = [".", "experiments/anatomy4_detector/tests", "experiments/anatomy4_specialists/tests"]



